[mod-setting-description]
wp-railgun-damage=Base physical damage dealt to every enemy the slug passes through, before the damage multiplier map setting. No falloff over distance.\nRange: 1 to 100000. Default: 200.
wp-railgun-range=How far the railgun looks for enemies and how far each slug travels.\nRange: 5 to 150 tiles. Default: 50.
wp-railgun-cooldown=Time between shots for each railgun.\nRange: 0.5 to 30 seconds. Default: 3.
wp-railgun-shot-energy=Energy each shot takes from the armor's power.\nRange: 0.1 to 1000 MJ. Default: 5.
wp-railgun-idle-drain=Power each railgun draws constantly while it sits in an equipment grid, shooting or not.\nRange: 0 to 100000 kW. Default: 150.
wp-railgun-allow-multiple=Off: a second railgun placed in the same grid is handed back, and only one railgun per grid fires. On: every railgun in a grid fires, taking turns.\nDefault: Off.
wp-railgun-damage-multiplier=Multiplies the base damage. At the default 5x, each slug deals 1000 damage.\nRange: 1x to 10x. Default: 5x.
wp-railgun-width=How wide a strip each slug tears through. Enemies are hit if any part of them is inside it. Crank it up for a nest eraser.\nRange: 0.5 to 50 tiles. Default: 2.5.

[wp-railgun]
one-per-grid=Structural integrity reached. Configure in map settings.
