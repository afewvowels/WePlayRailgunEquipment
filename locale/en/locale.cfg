wp-personal-railgun-equipment=Fires a slug that tears through every enemy in a straight line. Slow, brutal and incredibly power-hungry. Every shot uses one railgun round from your inventory.
wp-railgun-slug=Ammo for the personal railgun. Each shot uses one slug from your inventory, or from the vehicle's trunk when the railgun is in a vehicle.

